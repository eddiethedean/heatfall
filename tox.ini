[tox]
minversion = 4.0.0
envlist = py38, py39, py310, py311, py312, py313, ruff, mypy
isolated_build = true

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:ruff]
deps = ruff
commands = 
    ruff check src tests examples docs/conf.py
    ruff format --check src tests examples docs/conf.py

[testenv:mypy]
deps =
    -r{toxinidir}/requirements_dev.txt
commands = mypy src examples docs/conf.py

[testenv:docs]
basepython = python3.13
deps =
extras = docs
commands = python -m sphinx -b html -W --keep-going docs {envtmpdir}/html

[testenv:geo]
basepython = python3.13
extras = geo
commands = pytest --basetemp={envtmpdir}

[testenv:cairo]
basepython = python3.13
extras = cairo
commands = pytest --basetemp={envtmpdir}
