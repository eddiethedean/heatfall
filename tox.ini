[tox]
minversion = 4.0.0
envlist = py38, py39, py310, py311, py312, py313, ruff, mypy
isolated_build = true

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:ruff]
deps = ruff
commands = 
    ruff check src tests examples
    ruff format --check src tests examples

[testenv:mypy]
deps =
    -r{toxinidir}/requirements_dev.txt
commands = mypy src examples
