name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov-fail-under=100

  quality:
    name: Lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tox
        run: python -m pip install tox
      - name: Check
        run: python -m tox -e ruff,mypy

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

  package:
    name: Package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl pytest pytest-cov
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check version
        run: >-
          python -c "from importlib.metadata import version; import heatfall;
          assert heatfall.__version__ == version('heatfall');
          assert 'site-packages' in heatfall.__file__"
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" --cov-fail-under=100
      - name: Save distributions
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: heatfall-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
